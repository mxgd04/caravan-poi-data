name: Construir dataset de POIs

on:
  schedule:
    - cron: '0 3 * * 1'   # cada lunes a las 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: iberia
            regions: spain portugal andorra
            locations: flex_mem
          - pack: france
            regions: france monaco
            locations: disk
    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Directorio de trabajo
        run: |
          # Con índice de nodos en disco hace falta espacio: se usa /mnt si tiene más libre que /
          WORK="$GITHUB_WORKSPACE"
          if [ -d /mnt ]; then
            free_root=$(df --output=avail -k / | tail -n 1)
            free_mnt=$(df --output=avail -k /mnt | tail -n 1)
            if [ "$free_mnt" -gt "$free_root" ]; then
              sudo mkdir -p /mnt/work
              sudo chown "$(id -u):$(id -g)" /mnt/work
              WORK=/mnt/work
            fi
          fi
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "Directorio de trabajo: $WORK"
          df -h

      - name: Descargar extractos de Geofabrik
        run: |
          mkdir -p "$WORK/in"
          for region in ${{ matrix.regions }}; do
            curl -fL --retry 3 -o "$WORK/in/${region}.osm.pbf" "https://download.geofabrik.de/europe/${region}-latest.osm.pbf"
            curl -fL --retry 3 -o "$WORK/in/${region}.poly" "https://download.geofabrik.de/europe/${region}.poly"
          done
          df -h

      - name: Construir los datasets
        run: |
          mkdir -p dist
          REGIONS=""
          for region in ${{ matrix.regions }}; do
            REGIONS="$REGIONS --region ${region}:$WORK/in/${region}.osm.pbf:$WORK/in/${region}.poly"
          done
          for script in dataset restrictions lanes speeds places; do
            echo "::group::build_${script}.py"
            if [ "${{ matrix.locations }}" = "disk" ]; then
              # Índice de nodos en disco (con flex_mem Francia no cabe en 16 GB); el script lo borra entre pasadas
              LOC="sparse_file_array,$WORK/nodes-${script}.idx"
            else
              LOC=flex_mem
            fi
            python build_${script}.py --out dist --name ${{ matrix.pack }} --locations "$LOC" $REGIONS
            rm -f "$WORK/nodes-${script}.idx"
            df -h
            echo "::endgroup::"
          done
          ls -l dist

      - name: Publicar en la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest || gh release create latest --title "Datos POI" \
            --notes "Dataset semanal de puntos de interés para caravanas. Datos © colaboradores de OpenStreetMap, disponibles bajo la ODbL 1.0 — https://www.openstreetmap.org/copyright"
          gh release upload latest dist/* --clobber
