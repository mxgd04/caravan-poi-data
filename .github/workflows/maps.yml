name: Construir mapa sin conexión

on:
  schedule:
    - cron: '0 4 1 * *'   # el día 1 de cada mes a las 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  PLANETILER_VERSION: v0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Descargar y unir los extractos de Geofabrik
        run: |
          mkdir -p in dist
          for region in spain portugal andorra; do
            curl -fL --retry 3 -o "in/${region}.osm.pbf" "https://download.geofabrik.de/europe/${region}-latest.osm.pbf"
          done
          osmium merge in/spain.osm.pbf in/portugal.osm.pbf in/andorra.osm.pbf -o in/iberia.osm.pbf
          osmium fileinfo -e -g data.bbox in/iberia.osm.pbf | tee in/bbox.txt
          rm in/spain.osm.pbf in/portugal.osm.pbf in/andorra.osm.pbf
          df -h

      - name: Descargar Planetiler
        run: |
          curl -fL --retry 3 -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/${PLANETILER_VERSION}/planetiler.jar"
          echo "${PLANETILER_SHA256}  planetiler.jar" | sha256sum -c -

      - name: Generar iberia.pmtiles (esquema OpenMapTiles)
        run: |
          # --download baja las fuentes auxiliares (agua, lagos, Natural Earth); osmdata.openstreetmap.de falla a veces, de ahí los reintentos
          for attempt in 1 2 3; do
            java -Xmx12g -jar planetiler.jar \
              --osm-path=in/iberia.osm.pbf --output=dist/iberia.pmtiles \
              --download --force --maxzoom=14 \
              --storage=mmap --nodemap-type=sparsearray --nodemap-storage=mmap \
              && break
            echo "Intento $attempt fallido"; sleep 60
            [ "$attempt" = 3 ] && exit 1
          done
          ls -l dist
          df -h

      - name: Recursos de estilo (estilos, sprites, tipografías)
        run: python3 build_map_assets.py --out dist

      - name: Partir en trozos de 1,9 GB y escribir los metadatos
        run: |
          split -b 1900M -d -a 2 dist/iberia.pmtiles dist/iberia.pmtiles.part
          python3 build_maps_meta.py --dist dist --bbox "$(tail -n 1 in/bbox.txt)" --maxzoom 14

      - name: Publicar en la release "maps-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-latest >/dev/null 2>&1 || gh release create maps-latest --title "Mapa sin conexión" \
            --notes "Mapa vectorial de España, Portugal y Andorra (OpenMapTiles, PMTiles). Mapa © OpenMapTiles © colaboradores de OpenStreetMap (ODbL) — https://www.openstreetmap.org/copyright"
          # Primero las partes y los recursos; el meta va el último para que la app nunca vea un meta que apunte a partes ausentes
          gh release upload maps-latest dist/iberia.pmtiles.part* dist/map-assets.zip --clobber
          # Partes obsoletas: las que ya no se han generado en esta ejecución (un mapa menor puede tener menos partes)
          keep=$(cd dist && ls iberia.pmtiles.part*)
          for asset in $(gh release view maps-latest --json assets --jq '.assets[].name' | grep '^iberia\.pmtiles\.part'); do
            echo "$keep" | grep -qx "$asset" || gh release delete-asset maps-latest "$asset" --yes
          done
          gh release upload maps-latest dist/maps-meta.json --clobber
